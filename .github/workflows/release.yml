name: Release

# Push a tag that matches manifest.json "version" (for example 0.1.0 or v0.1.0)
# from the default branch. The workflow tests, builds main.js and publishes a
# GitHub Release with the two assets EdgeEver installs: manifest.json and main.js.
on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches manifest version
        run: |
          version="$(jq -r .version manifest.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run test

      - name: Build main.js
        run: bun run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" manifest.json main.js \
            --title "WordPress Publisher $GITHUB_REF_NAME" \
            --notes "Install in EdgeEver from the Plugin Marketplace page by pasting https://github.com/${GITHUB_REPOSITORY}" \
            --verify-tag
